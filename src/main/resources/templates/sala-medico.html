<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sala de Reunião - Médico</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(120deg, #3498db 0%, #6dd5fa 100%);
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 420px;
            margin: 60px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 32px #0002;
            padding: 2.5rem 2rem 2rem 2rem;
            text-align: center;
        }
        h2 {
            color: #217dbb;
            margin-bottom: 1.2rem;
        }
        p {
            color: #34495e;
            font-size: 1.1rem;
        }
        .icon-area {
            margin: 2rem 0 1.5rem 0;
        }
        .icon-area img {
            width: 90px;
            border-radius: 50%;
            background: #eaf6fb;
            padding: 1rem;
            box-shadow: 0 2px 8px #3498db22;
        }
        .info {
            color: #2980b9;
            margin-top: 1.2rem;
            font-size: 1rem;
            background: #eaf6fb;
            border-radius: 8px;
            padding: 0.7rem;
        }
        .btn {
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.8rem 2.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2.2rem;
            box-shadow: 0 2px 8px #3498db33;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #217dbb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sala de Reunião</h2>
        <p>Você está representando o <b>Médico</b> nesta reunião.</p>
        <div class="icon-area">
            <img src="https://img.icons8.com/ios-filled/100/3498db/doctor-male.png" alt="Médico">
        </div>
        <div class="info">
            <b>Simulação:</b> Aqui seria exibida a videoconferência ou chat da consulta.
        </div>
        <form th:action="@{/reunioes/finalizar}" method="post" style="margin-top: 2rem;">
            <input type="hidden" name="agendamentoId" th:value="${agendamentoId}" />
            <input type="hidden" name="medicoId" th:value="${medicoId}" />
            <button type="submit" class="btn">Finalizar Reunião</button>
        </form>
        <a th:href="@{/historico/medico(medicoId=${medicoId})}" class="btn">Voltar para Histórico do Médico</a>
    </div>
</body>
</html>
