spring.application.name=Medlink

# Configuração do banco de dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/medlink?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=pedro
spring.datasource.password=pedro14345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false
spring.flyway.out-of-order=true

server.port=8080

# Configurações de tratamento de erro
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Configurações de validação
spring.jpa.properties.jakarta.persistence.validation.mode=ddl
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# Configurações de logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configurações de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Google OAuth Configuration (configure with your own credentials)
# google.client.client-id=YOUR_GOOGLE_CLIENT_ID
# google.client.client-secret=YOUR_GOOGLE_CLIENT_SECRET 