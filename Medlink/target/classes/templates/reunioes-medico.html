<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reuniões Agendadas - Médico | MedLink</title>
    <meta charset="UTF-8">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            margin-top: 40px;
            padding: 2rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(44, 62, 80, 0.10);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }
        th, td {
            padding: 0.9rem 0.5rem;
            text-align: center;
        }
        th {
            background: #3498db;
            color: white;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background: #f2f6fa;
        }
        tr:nth-child(odd) {
            background: #eaf1f8;
        }
        a, a:visited {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        .logout-link {
            display: block;
            text-align: center;
            margin-top: 0.5rem;
            color: #e74c3c;
            font-weight: 500;
        }
        .logout-link:hover {
            text-decoration: underline;
        }
        .btn-finalizar {
            background: #e67e22;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.7rem 1.2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.3rem;
            transition: background 0.2s;
        }
        .btn-finalizar:hover {
            background: #ca6f1e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reuniões Agendadas (Médico)</h2>
        <a th:href="@{'/medico/' + ${medicoId} + '/editar'}" style="display:inline-block;margin-bottom:1.2rem;color:#27ae60;font-weight:600;">Editar Perfil</a>
        <table>
            <tr>
                <th>Data/Hora</th>
                <th>Paciente</th>
                <th>Link</th>
            </tr>
            <tr th:each="r : ${reunioes}">
                <td th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${r.paciente.nome}"></td>
                <td>
                    <a th:if="${r.linkSala != null and #strings.contains(r.linkSala, '/sala/')}"
                       th:href="@{'/sala/' + ${#strings.substring(r.linkSala, r.linkSala.lastIndexOf('/') + 1)} + '?medicoId=' + ${medicoId}}">Entrar na sala</a>
                    <span th:if="${r.linkSala == null or !#strings.contains(r.linkSala, '/sala/')}" >Link indisponível</span>
                    <form th:action="@{/reunioes/finalizar}" method="post" th:if="${!r.finalizado}" style="margin-top:0.5rem;">
                        <input type="hidden" name="agendamentoId" th:value="${r.id}" />
                        <input type="hidden" name="medicoId" th:value="${medicoId}" />
                        <button type="submit" class="btn-finalizar">Finalizar</button>
                    </form>
                </td>
            </tr>
        </table>
        <a th:href="@{/historico/medico(medicoId=${medicoId})}">Ver Histórico</a>
        <br>
        <a th:href="@{/medico/disponibilidade(medicoId=${medicoId})}">Definir Disponibilidade</a>
        <a href="/login" class="logout-link">Sair</a>
    </div>
</body>
</html>
