spring.application.name=Medlink

# Configuração do banco de dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/medlink?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=pedro
spring.datasource.password=pedro14345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do Hibernate - criar tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuração do Flyway - DESABILITADO TEMPORARIAMENTE
spring.flyway.enabled=false
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true
# spring.flyway.validate-on-migrate=true
# spring.flyway.clean-disabled=false
# spring.flyway.out-of-order=true

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

api.security.token.secret=${JWT_SECRET:my-secret-key}

# Configurações de Logging para DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=DEBUG
logging.level.phenrique.com.A3.Medlink=DEBUG
logging.level.org.hibernate.SQL=DEBUG

server.port=8080