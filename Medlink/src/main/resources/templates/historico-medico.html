<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Histórico do Médico | MedLink</title>
    <meta charset="UTF-8">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            margin-top: 40px;
            padding: 2rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(44, 62, 80, 0.10);
            width: 100%;
            max-width: 700px;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }
        th, td {
            padding: 0.9rem 0.5rem;
            text-align: center;
        }
        th {
            background: #3498db;
            color: white;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background: #f2f6fa;
        }
        tr:nth-child(odd) {
            background: #eaf1f8;
        }
        a, a:visited {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 6px;
            background-color: #3498db;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 1rem;
        }
        .btn:hover {
            background-color: #217dbb;
        }
        .logout-link {
            display: block;
            text-align: center;
            margin-top: 0.5rem;
            color: #e74c3c;
            font-weight: 500;
        }
        .logout-link:hover {
            text-decoration: underline;
        }
        .btn-voltar {
            display: block;
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 6px;
            background: none;
            color: #2c3e50;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1rem;
            text-decoration: underline;
            cursor: pointer;
            transition: color 0.2s;
        }
        .btn-voltar:hover {
            color: #3498db;
        }
        @media (max-width: 600px) {
            .container {
                padding: 1rem 0.5rem;
                max-width: 100%;
            }
            table, th, td {
                font-size: 0.95rem;
            }
            .btn {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Histórico de Reuniões (Médico)</h2>
        <table>
            <tr>
                <th>Data/Hora</th>
                <th>Paciente</th>
            </tr>
            <tr th:each="r : ${historico}">
                <td th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${r.paciente != null ? r.paciente.nome : '---'}"></td>
            </tr>
        </table>
        <a th:href="@{/reunioes(medicoId=${medicoId})}" class="btn-voltar">Voltar para Minhas Reuniões</a>
        <a href="/login" class="logout-link">Sair</a>
    </div>
</body>
</html>
