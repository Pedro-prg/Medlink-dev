<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Perfil do Médico</title>
    <meta charset="UTF-8">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .edit-container {
            background: white;
            padding: 2.5rem 2.5rem 2rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(44, 62, 80, 0.10);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #34495e;
            font-weight: 500;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            background: #f9f9f9;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
            background: #fff;
        }
        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 6px;
            background-color: #3498db;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 0.5rem;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="edit-container">
        <h2>Editar Perfil Profissional</h2>
        <form th:action="@{'/medico/' + ${medico.id} + '/editar'}" method="post">
            <div class="form-group">
                <label for="especialidades">Especialidades</label>
                <input type="text" id="especialidades" name="especialidades" th:value="${medico.especialidades}" placeholder="Ex: Psicologia Clínica, Terapia Cognitivo-Comportamental">
            </div>
            <div class="form-group">
                <label for="experiencias">Experiências</label>
                <input type="text" id="experiencias" name="experiencias" th:value="${medico.experiencias}" placeholder="Ex: 10 anos de atendimento, atuação em hospitais">
            </div>
            <div class="form-group">
                <label for="trabalhosPassados">Trabalhos Passados</label>
                <input type="text" id="trabalhosPassados" name="trabalhosPassados" th:value="${medico.trabalhosPassados}" placeholder="Ex: Hospital X, Clínica Y">
            </div>
            <button type="submit" class="btn">Salvar</button>
        </form>
        <a th:href="@{'/medico/' + ${medico.id}}" class="back-link">Voltar ao perfil</a>
    </div>
</body>
</html>
