<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - MedLink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .register-container {
            background: white;
            padding: 2.5rem 2.5rem 2rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(44, 62, 80, 0.10);
            width: 100%;
            max-width: 400px;
        }
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .register-header h1 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 2.2rem;
        }
        .register-header p {
            color: #7f8c8d;
            font-size: 1rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #34495e;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            background: #f9f9f9;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #3498db;
            background: #fff;
        }
        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 6px;
            background-color: #3498db;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 0.5rem;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .login-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>Cadastro</h1>
            <p>Crie sua conta no MedLink</p>
        </div>

        <form th:action="@{/registro}" method="post">
            <div th:if="${erro}" class="error-message" th:text="${erro}"></div>
            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required minlength="6">
            </div>
            <div class="form-group">
                <label for="tipo">Tipo de usuário</label>
                <select id="tipo" name="tipo" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="PACIENTE">Paciente</option>
                    <option value="MEDICO">Médico</option>
                </select>
            </div>
            <div id="medico-extra-fields" style="display:none;">
                <div class="form-group">
                    <label for="crm">CRM</label>
                    <input type="text" id="crm" name="crm">
                </div>
                <div class="form-group">
                    <label for="especialidades">Especialidades</label>
                    <input type="text" id="especialidades" name="especialidades" placeholder="Ex: Psicologia Clínica, Terapia Cognitivo-Comportamental">
                </div>
                <div class="form-group">
                    <label for="experiencias">Experiências</label>
                    <input type="text" id="experiencias" name="experiencias" placeholder="Ex: 10 anos de atendimento, atuação em hospitais">
                </div>
                <div class="form-group">
                    <label for="trabalhosPassados">Trabalhos Passados</label>
                    <input type="text" id="trabalhosPassados" name="trabalhosPassados" placeholder="Ex: Hospital X, Clínica Y">
                </div>
            </div>
            <div id="paciente-extra-fields" style="display:none;">
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf">
                </div>
            </div>
            <button type="submit" class="btn">Cadastrar</button>
        </form>

        <div class="login-link">
            <p>Já possui uma conta? <a href="/login">Faça login</a></p>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var tipoSelect = document.getElementById('tipo');
            var medicoFields = document.getElementById('medico-extra-fields');
            var pacienteFields = document.getElementById('paciente-extra-fields');
            tipoSelect.addEventListener('change', function() {
                if (this.value === 'MEDICO') {
                    medicoFields.style.display = '';
                    pacienteFields.style.display = 'none';
                } else if (this.value === 'PACIENTE') {
                    medicoFields.style.display = 'none';
                    pacienteFields.style.display = '';
                } else {
                    medicoFields.style.display = 'none';
                    pacienteFields.style.display = 'none';
                }
            });
            // Exibe se já estiver selecionado ao recarregar
            if (tipoSelect.value === 'MEDICO') {
                medicoFields.style.display = '';
                pacienteFields.style.display = 'none';
            } else if (tipoSelect.value === 'PACIENTE') {
                medicoFields.style.display = 'none';
                pacienteFields.style.display = '';
            }
        });
    </script>
</body>
</html>
