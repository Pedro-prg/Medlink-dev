<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Minhas Reuniões - Paciente | MedLink</title>
    <meta charset="UTF-8">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            margin-top: 40px;
            padding: 2rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(44, 62, 80, 0.10);
            width: 100%;
            max-width: 700px;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }
        th, td {
            padding: 0.9rem 0.5rem;
            text-align: center;
        }
        th {
            background: #3498db;
            color: white;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background: #f2f6fa;
        }
        tr:nth-child(odd) {
            background: #eaf1f8;
        }
        a, a:visited {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 6px;
            background-color: #2ecc71;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 1rem;
        }
        .btn:hover {
            background-color: #27ae60;
        }
        .logout-link {
            display: block;
            text-align: center;
            margin-top: 0.5rem;
            color: #e74c3c;
            font-weight: 500;
        }
        .logout-link:hover {
            text-decoration: underline;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            align-items: center;
        }
        .btn-excluir {
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.7rem 1.2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.3rem;
            transition: background 0.2s;
        }
        .btn-excluir:hover {
            background: #c0392b;
        }
        @media (max-width: 600px) {
            .container {
                padding: 1rem 0.5rem;
                max-width: 100%;
            }
            table, th, td {
                font-size: 0.95rem;
            }
            .btn {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Minhas Reuniões (Paciente)</h2>
        <table>
            <tr>
                <th>Data/Hora</th>
                <th>Médico</th>
                <th>Ações</th>
            </tr>
            <tr th:each="r : ${reunioes}">
                <td th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${r.medico != null ? r.medico.nome : '---'}"></td>
                <td class="actions">
                    <a th:if="${r.linkSala != null and #strings.contains(r.linkSala, '/sala/')}"
                       th:href="@{'/sala/' + ${#strings.substring(r.linkSala, r.linkSala.lastIndexOf('/') + 1)} + '?pacienteId=' + ${pacienteId}}">Entrar na sala</a>
                    <span th:if="${r.linkSala == null or !#strings.contains(r.linkSala, '/sala/')}" >Link indisponível</span>
                    <a th:if="${r.medico != null}" th:href="@{'/medico/' + ${r.medico.id}}">Ver perfil do médico</a>
                    <form th:action="@{/reunioes/excluir}" method="post" style="margin-top:0.5rem;">
                        <input type="hidden" name="agendamentoId" th:value="${r.id}" />
                        <input type="hidden" name="pacienteId" th:value="${pacienteId}" />
                        <button type="submit" class="btn-excluir">Excluir</button>
                    </form>
                </td>
            </tr>
        </table>
        <form th:action="@{/agendar}" method="get">
            <input type="hidden" name="pacienteId" th:value="${pacienteId}">
            <button type="submit" class="btn">Novo Agendamento</button>
        </form>
        <a th:href="@{/historico/paciente(pacienteId=${pacienteId})}">Ver Histórico</a>
        <a href="/login" class="logout-link">Sair</a>
    </div>
</body>
</html>
